<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Egg Price Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .chart-container {
      position: relative;
      height: 400px;
      width: 100%;
      margin: 20px 0;
    }
    form {
      margin: 20px 0;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 5px;
    }
    input {
      margin: 5px 0;
      padding: 5px;
    }
    button {
      padding: 5px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #45a049;
    }
    button.delete {
      background: #f44336;
    }
    button.delete:hover {
      background: #da190b;
    }
    #priceList {
      list-style: none;
      padding: 0;
    }
    #priceList li {
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }
    .button-group {
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Egg Price Tracker</h1>

  <form id="priceForm">
    Date: <input type="date" id="date"><br>
    Product: <input type="text" id="name" value="Eggs"><br>
    Price: <input type="number" id="price" step="0.1"><br>
    <button type="submit">Add</button>
  </form>

  <div class="button-group">
    <button onclick="scrapePrice()">Get Price from PXMart</button>
    <button class="delete" onclick="deletePrices()">Clear All Prices</button>
  </div>
  <p id="scrapedPrice"></p>

  <h3>Price History</h3>
  <ul id="priceList"></ul>

  <h3>Price Chart</h3>
  <div class="chart-container">
    <canvas id="priceChart"></canvas>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
